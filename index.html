<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartEditor Pro | AI Video Editor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f0f1a;
            --card-bg: #1a1a2e;
            --primary-gradient: linear-gradient(90deg, #d946ef, #ec4899);
            --accent-green: #84cc16;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 480px; /* Мобильный вид */
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Шапка */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid #333;
        }

        .brand {
            font-size: 20px;
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            font-size: 12px;
            background: rgba(132, 204, 22, 0.2);
            color: var(--accent-green);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid var(--accent-green);
        }

        /* Карточка загрузки */
        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 30px 20px;
            text-align: center;
            border: 1px solid #333;
        }

        .upload-area {
            border: 2px dashed #444;
            border-radius: 12px;
            padding: 40px 20px;
            margin-bottom: 20px;
            cursor: pointer;
            transition: 0.3s;
        }

        .upload-area:hover {
            border-color: #d946ef;
            background: rgba(217, 70, 239, 0.05);
        }

        h3 { margin: 10px 0 5px; }
        p { color: var(--text-muted); font-size: 13px; margin: 0; }

        .btn-action {
            background: var(--primary-gradient);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(217, 70, 239, 0.3);
        }
        
        .btn-action:disabled {
            background: #444;
            cursor: not-allowed;
            box-shadow: none;
        }

        #fileInput { display: none; }

        /* Лог */
        .log-area {
            background: #111;
            padding: 15px;
            border-radius: 10px;
            font-family: monospace;
            font-size: 12px;
            color: #aaa;
            height: 100px;
            overflow-y: auto;
            text-align: left;
        }
        
        .log-success { color: var(--accent-green); }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div class="brand">SmartEditor <span style="font-size: 10px; opacity: 0.7; font-weight: 400;">PRO</span></div>
        <div class="status-badge">● Online</div>
    </div>

    <div class="card">
        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
            <div style="font-size: 30px;">📂</div>
            <h3>Загрузить видео</h3>
            <p>Нажми, чтобы выбрать файл из галереи</p>
        </div>
        <input type="file" id="fileInput" accept="video/*">
        
        <button id="processBtn" class="btn-action" disabled onclick="startProcess()">
            Автоматически смонтировать
        </button>
    </div>

    <div class="log-area" id="logs">
        > Система готова к работе...
    </div>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const processBtn = document.getElementById('processBtn');
    const logs = document.getElementById('logs');

    fileInput.addEventListener('change', function() {
        if (this.files && this.files[0]) {
            const fileName = this.files[0].name;
            processBtn.disabled = false;
            addLog(`✅ Файл выбран: ${fileName}`);
            addLog(`📊 Размер: ${(this.files[0].size / 1024 / 1024).toFixed(2)} MB`);
        }
    });

    function addLog(text) {
        const p = document.createElement('div');
        p.innerText = '> ' + text;
        if(text.includes('✅')) p.className = 'log-success';
        logs.appendChild(p);
        logs.scrollTop = logs.scrollHeight;
    }

    function startProcess() {
        addLog('🚀 Запуск анализа нейросетью...');
        processBtn.disabled = true;
        processBtn.innerText = "Обработка...";
        
        setTimeout(() => {
            addLog('🧠 ИИ: Нашел 3 лучших момента...');
        }, 2000);

        setTimeout(() => {
            addLog('🎬 Генерация итогового ролика...');
        }, 4000);
        
        setTimeout(() => {
            addLog('✅ ГОТОВО! (Логика пока не подключена)');
            processBtn.innerText = "Готово!";
            processBtn.style.background = "var(--accent-green)";
        }, 6000);
    }
</script>

</body>
</html>
