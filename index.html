<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SmartEditor Pro | AI Mobile Editor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Новая версия FFmpeg.wasm (0.12+) для лучшей совместимости -->
    <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.7/dist/umd/ffmpeg.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.js"></script>
    
    <!-- Face API -->
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

    <style>
        :root {
            --bg-color: #0f0f1a;
            --card-bg: #1a1a2e;
            --primary-gradient: linear-gradient(90deg, #d946ef, #ec4899);
            --accent-green: #84cc16;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .app-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            text-align: center;
            padding-bottom: 15px;
            border-bottom: 1px solid #333;
        }

        .brand {
            font-size: 24px;
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: block;
            margin-bottom: 5px;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(217, 70, 239, 0.1);
            color: #d946ef;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            border: 1px solid #333;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .upload-area {
            border: 2px dashed #444;
            border-radius: 12px;
            padding: 30px 20px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: 0.3s;
            position: relative;
        }
        .upload-area:hover { border-color: #d946ef; background: rgba(217, 70, 239, 0.05); }
        .upload-icon { font-size: 40px; margin-bottom: 10px; display: block; }

        h3 { margin: 0 0 5px; font-size: 18px; }
        .sub-text { color: var(--text-muted); font-size: 13px; margin-bottom: 15px; display: block; line-height: 1.4; }

        .btn-action {
            background: var(--primary-gradient);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(217, 70, 239, 0.3);
            transition: transform 0.2s;
        }
        .btn-action:active { transform: scale(0.98); }
        .btn-action:disabled { background: #444; cursor: not-allowed; box-shadow: none; opacity: 0.7; }

        #fileInput { display: none; }
        #hiddenVideo, #hiddenCanvas { display: none; }

        .log-area {
            background: #111;
            padding: 15px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #aaa;
            height: 150px;
            overflow-y: auto;
            border: 1px solid #333;
            text-align: left;
        }
        .log-entry { margin-bottom: 4px; }
        .log-success { color: var(--accent-green); }
        .log-error { color: #ef4444; }
        .log-ai { color: #d946ef; font-weight: bold; }
        .log-process { color: #3b82f6; }

        .result-box {
            display: none;
            background: #252540;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid var(--accent-green);
            animation: fadeIn 0.5s ease;
        }
        
        video.result-preview {
            width: 100%;
            border-radius: 8px;
            margin-bottom: 15px;
            background: #000;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Прогресс бар */
        .progress-container {
            width: 100%;
            background-color: #333;
            border-radius: 5px;
            margin-top: 10px;
            height: 6px;
            overflow: hidden;
            display: none;
        }
        .progress-bar {
            height: 100%;
            background: var(--primary-gradient);
            width: 0%;
            transition: width 0.3s;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <span class="brand">SmartEditor Pro</span>
        <span class="status-badge" id="systemStatus">AI Ready</span>
    </div>

    <!-- Загрузка -->
    <div class="card">
        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
            <span class="upload-icon">📁</span>
            <h3>Загрузить видео</h3>
            <span class="sub-text">Нажмите или перетащите файл<br>(Поддерживаются длинные видео до 500Мб)</span>
            <input type="file" id="fileInput" accept="video/*">
        </div>
        <div id="fileInfo" style="font-size: 13px; color: #fff; margin-bottom: 10px;"></div>
        <button id="startBtn" class="btn-action" disabled>🚀 Запустить AI Монтаж</button>
        
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>
    </div>

    <!-- Логи -->
    <div class="log-area" id="logArea">
        <div class="log-entry">Ожидание загрузки видео...</div>
    </div>

    <!-- Результат -->
    <div class="result-box" id="resultBox">
        <h3 style="color: var(--accent-green)">Готово!</h3>
        <p class="sub-text">Ваш умный клип создан</p>
        <video id="resultVideo" controls class="result-preview"></video>
        <a id="downloadLink" class="btn-action" style="display:block; text-decoration:none; box-sizing:border-box;">⬇️ Скачать MP4</a>
        <button onclick="location.reload()" style="background:none; border:none; color:#666; margin-top:15px; cursor:pointer; font-size:12px;">Начать заново</button>
    </div>
</div>

<video id="hiddenVideo" playsinline muted></video>
<canvas id="hiddenCanvas"></canvas>

<script>
    const { FFmpeg } = FFmpegWASM;
    const { fetchFile } = FFmpegUtil;

    let ffmpeg = null;
    let fileData = null;
    let fileName = "";

    // Элементы UI
    const logArea = document.getElementById('logArea');
    const startBtn = document.getElementById('startBtn');
    const fileInput = document.getElementById('fileInput');
    const fileInfo = document.getElementById('fileInfo');
    const resultBox = document.getElementById('resultBox');
    const resultVideo = document.getElementById('resultVideo');
    const downloadLink = document.getElementById('downloadLink');
    const progressBar = document.getElementById('progressBar');
    const progressContainer = document.getElementById('progressContainer');
    const systemStatus = document.getElementById('systemStatus');

    // Логирование
    function log(msg, type = '') {
        const div = document.createElement('div');
        div.className = `log-entry ${type}`;
        div.textContent = `> ${msg}`;
        logArea.appendChild(div);
        logArea.scrollTop = logArea.scrollHeight;
    }

    // Инициализация FFmpeg
    async function initFFmpeg() {
        if (ffmpeg) return true;
        try {
            log('Инициализация видеоядра...', 'log-process');
            ffmpeg = new FFmpeg();
            
            // Логирование прогресса от ffmpeg
            ffmpeg.on('log', ({ message }) => {
                // Фильтруем спам, оставляем важное
                if(message.includes('frame=') || message.includes('time=')) {
                   // Можно парсить прогресс, но пока просто тишина для чистоты лога
                }
            });

            ffmpeg.on('progress', ({ progress }) => {
                const pct = Math.round(progress * 100);
                progressBar.style.width = `${pct}%`;
                if(pct < 100) log(`Обработка видео: ${pct}%`, 'log-process');
            });

            // Загрузка ядра с CDN, который поддерживает CORS
            await ffmpeg.load({
                coreURL: "https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.js",
            });
            
            log('Видеоядро готово!', 'log-success');
            return true;
        } catch (e) {
            console.error(e);
            log('Ошибка загрузки ядра: ' + e.message, 'log-error');
            log('Попробуйте открыть сайт в Chrome на Android/iOS.', 'log-error');
            return false;
        }
    }

    // Загрузка моделей FaceAPI
    async function loadModels() {
        log('Загрузка AI моделей (лица)...', 'log-ai');
        const MODEL_URL = 'https://justadudewhohacks.github.io/face-api.js/models';
        try {
            await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
            await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
            await faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL);
            log('AI модели загружены!', 'log-success');
            systemStatus.textContent = "AI Готов";
            systemStatus.style.background = "rgba(132, 204, 22, 0.1)";
            systemStatus.style.color = "#84cc16";
        } catch (e) {
            log('Ошибка AI моделей: ' + e.message, 'log-error');
        }
    }

    // Обработка файла
    fileInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        fileName = file.name;
        fileData = file;
        fileInfo.textContent = `Файл: ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`;
        startBtn.disabled = false;
        log('Файл выбран. Готов к монтажу.', 'log-success');
        
        // Предзагрузка моделей пока пользователь думает
        loadModels();
        initFFmpeg();
    });

    // Анализ видео и поиск лучших моментов
    async function analyzeVideoSegments(videoElement) {
        log('Анализ кадров: поиск лиц и эмоций...', 'log-ai');
        
        const detections = [];
        const duration = videoElement.duration;
        const step = 2.0; // Проверяем каждые 2 секунды для скорости
        
        // Настройка детектора
        const options = new faceapi.TinyFaceDetectorOptions({ inputSize: 416, scoreThreshold: 0.5 });

        let currentTime = 0;
        while (currentTime < duration) {
            videoElement.currentTime = currentTime;
            // Ждем обновления кадра
            await new Promise(r => videoElement.addEventListener('seeked', r, { once: true }));

            const detection = await faceapi.detectSingleFace(videoElement, options).withFaceLandmarks().withFaceExpressions();
            
            if (detection) {
                // Если есть лицо и эмоция не нейтральная/скучная
                const expressions = detection.expressions;
                const maxEmotion = Object.keys(expressions).reduce((a, b) => expressions[a] > expressions[b] ? a : b);
                const score = expressions[maxEmotion];

                // Считаем кадр интересным, если есть лицо и эмоция > 0.3 или просто есть лицо
                if (score > 0.3 || expressions.neutral < 0.6) {
                    detections.push({ time: currentTime, emotion: maxEmotion, score: score });
                }
            }
            
            currentTime += step;
            // Обновляем лог раз в 10 секунд прогресса
            if (Math.floor(currentTime) % 10 === 0) {
                log(`Проанализировано ${Math.floor((currentTime/duration)*100)}% видео...`, 'log-process');
            }
        }

        log(`Найдено ${detections.length} интересных моментов.`, 'log-success');
        return detections;
    }

    // Генерация команд для FFmpeg
    function generateFilterComplex(segments, duration) {
        if (segments.length === 0) return null;

        let filterParts = [];
        let inputs = [];
        let concatMap = "";
        
        // 1. Сначала создаем список сегментов (trim)
        segments.forEach((seg, index) => {
            const labelIn = `[0:v]trim=start=${seg.time}:duration=3,setpts=PTS-STARTPTS,scale=720:1280:force_original_aspect_ratio=increase,crop=720:1280,hue=s=1.2:contrast=1.1,v${index}]`;
            filterParts.push(labelIn);
            concatMap += `[v${index}]`;
        });

        // 2. Добавляем переходы (xfade) между сегментами
        // Если сегментов много, цепочка xfade становится очень длинной. 
        // Для упрощения в этой версии сделаем простой concat без сложных переходов внутри фильтра,
        // так как xfade цепочкой сложно генерировать динамически для N файлов в одном строке.
        // Вместо этого используем трюк: склеим, а потом наложим общий фильтр "динамики".
        
        // Упрощенный вариант: просто склеиваем найденные куски
        filterParts.push(`${concatMap}concat=n=${segments.length}:v=1:a=0[outv]`);

        return filterParts.join("") + ";[outv]format=yuv420p";
    }

    async function startFullProcess() {
        if (!fileData) return;
        
        startBtn.disabled = true;
        progressContainer.style.display = 'block';
        resultBox.style.display = 'none';
        logArea.innerHTML = ''; // Очистка логов

        const initialized = await initFFmpeg();
        if (!initialized) {
            startBtn.disabled = false;
            return;
        }

        try {
            // 1. Запись файла в виртуальную ФС
            log('Загрузка видео в память...', 'log-process');
            ffmpeg.writeFile('input.mp4', await fetchFile(fileData));

            // 2. Анализ контента
            const videoEl = document.getElementById('hiddenVideo');
            videoEl.src = URL.createObjectURL(fileData);
            await new Promise(r => videoEl.onloadeddata = r);
            
            const segments = await analyzeVideoSegments(videoEl);

            if (segments.length === 0) {
                log('Лица не найдены. Создаю нарезку из случайных моментов.', 'log-error');
                // Фоллбэк: просто режем на куски по 3 сек каждые 5 сек
                const duration = videoEl.duration;
                for(let t=0; t<duration; t+=5) {
                    if(t+3 < duration) segments.push({time: t});
                }
            }

            // Ограничим количество сегментов, чтобы не перегрузить браузер (макс 10 кусков)
            const finalSegments = segments.slice(0, 10);
            
            // 3. Сборка команды FFmpeg
            // Мы делаем вертикальный кроп (720x1280), повышаем насыщенность и контраст
            let filterComplex = "";
            let inputMaps = "";
            
            finalSegments.forEach((seg, i) => {
                // Trim -> Crop (Center) -> Scale -> Color Grade
                // hue=s=1.2 (насыщенность), contrast=1.1 (контраст)
                filterComplex += `[0:v]trim=start=${seg.time}:duration=3,setpts=PTS-STARTPTS,crop=ih*9/16:ih,hue=s=1.3:contrast=1.15[v${i}];`;
                inputMaps += `[v${i}]`;
            });

            filterComplex += `${inputMaps}concat=n=${finalSegments.length}:v=1:a=0[outv]`;

            log('Рендеринг финального видео...', 'log-process');
            
            await ffmpeg.exec([
                '-i', 'input.mp4',
                '-filter_complex', filterComplex,
                '-map', '[outv]',
                '-c:v', 'libx264',
                '-preset', 'medium',
                '-crf', '23',
                '-movflags', '+faststart',
                'output.mp4'
            ]);

            log('Рендеринг завершен!', 'log-success');

            // 4. Получение результата
            const data = await ffmpeg.readFile('output.mp4');
            const url = URL.createObjectURL(new Blob([data.buffer], { type: 'video/mp4' }));
            
            resultVideo.src = url;
            downloadLink.href = url;
            downloadLink.download = `smart_edit_${Date.now()}.mp4`;
            
            resultBox.style.display = 'block';
            log('Видео готово к скачиванию!', 'log-success');
            progressBar.style.width = '100%';

        } catch (error) {
            console.error(error);
            log('Критическая ошибка: ' + error.message, 'log-error');
            log('Совет: Попробуйте видео меньшего размера или другой браузер.', 'log-error');
        } finally {
            startBtn.disabled = false;
        }
    }

    startBtn.addEventListener('click', startFullProcess);

    // Предварительная загрузка при старте
    window.addEventListener('load', () => {
        log('Система загружается...', 'log-process');
        // Пытаемся инициализировать quietly
        initFFmpeg().then(() => loadModels());
    });

</script>
</body>
</html>
