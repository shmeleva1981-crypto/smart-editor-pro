<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SmartEditor Pro | Mobile AI</title>
    <!-- Шрифты -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- JSZip для скачивания папкой -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <!-- FFmpeg (Версия без SharedArrayBuffer для работы в браузере) -->
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
    
    <!-- Face API -->
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

    <style>
        :root {
            --bg: #09090b;
            --card: #18181b;
            --primary: #d946ef;
            --secondary: #8b5cf6;
            --text: #f4f4f5;
            --text-dim: #a1a1aa;
            --success: #22c55e;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 10px;
        }
        h1 {
            font-size: 24px;
            font-weight: 800;
            margin: 0;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p.subtitle {
            font-size: 13px;
            color: var(--text-dim);
            margin-top: 5px;
        }

        .card {
            background: var(--card);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #27272a;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        /* Настройки формата */
        .format-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .format-btn {
            flex: 1;
            padding: 10px;
            background: #27272a;
            border: 1px solid #3f3f46;
            color: var(--text-dim);
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: 0.2s;
        }
        .format-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* Загрузка */
        .upload-zone {
            border: 2px dashed #3f3f46;
            border-radius: 12px;
            padding: 30px 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            position: relative;
        }
        .upload-zone:hover {
            border-color: var(--primary);
            background: rgba(217, 70, 239, 0.05);
        }
        .upload-icon { font-size: 30px; margin-bottom: 10px; display: block; }
        .upload-text { font-size: 14px; color: var(--text-dim); }
        #fileInput { display: none; }

        /* Кнопка действия */
        .btn-main {
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            opacity: 0.5;
            pointer-events: none;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(217, 70, 239, 0.2);
        }
        .btn-main.ready {
            opacity: 1;
            pointer-events: all;
        }
        .btn-main:active { transform: scale(0.98); }

        /* Логи */
        .log-window {
            background: #000;
            border-radius: 8px;
            padding: 10px;
            height: 150px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            color: #ccc;
            border: 1px solid #333;
        }
        .log-entry { margin-bottom: 4px; }
        .log-info { color: #60a5fa; }
        .log-warn { color: #fbbf24; }
        .log-success { color: var(--success); font-weight: bold; }
        .log-error { color: #ef4444; }

        /* Результат */
        .result-area {
            display: none;
            flex-direction: column;
            gap: 10px;
            animation: slideUp 0.4s ease;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .video-preview {
            width: 100%;
            border-radius: 8px;
            background: #000;
            max-height: 300px;
        }

        .btn-download {
            background: #27272a;
            color: white;
            border: 1px solid #3f3f46;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            display: block;
        }
        .btn-download.zip {
            background: var(--success);
            border-color: var(--success);
            color: #000;
        }

        /* Скрытые элементы для обработки */
        #hiddenCanvas { display: none; }
        #hiddenVideo { display: none; }
        
        .loader {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>SmartEditor Pro</h1>
        <p class="subtitle">AI Нарезка длинных видео (Client-Side)</p>
    </header>

    <!-- Настройки -->
    <div class="card">
        <label style="font-size: 12px; color: var(--text-dim); display:block; margin-bottom: 8px;">Формат выхода:</label>
        <div class="format-selector">
            <div class="format-btn active" onclick="setFormat('vertical')" id="btn-vertical">📱 Вертикальный (9:16)</div>
            <div class="format-btn" onclick="setFormat('horizontal')" id="btn-horizontal">🖥 Горизонтальный (16:9)</div>
        </div>
    </div>

    <!-- Загрузка -->
    <div class="card">
        <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
            <span class="upload-icon">📁</span>
            <span class="upload-text" id="fileName">Нажмите, чтобы выбрать видео</span>
            <input type="file" id="fileInput" accept="video/*">
        </div>
    </div>

    <!-- Кнопка старта -->
    <button class="btn-main" id="startBtn" onclick="startProcess()">
        <span class="btn-text">🚀 Начать умный монтаж</span>
        <div class="loader" id="btnLoader"></div>
    </button>

    <!-- Логи -->
    <div class="log-window" id="logWindow">
        <div class="log-entry log-info">Система готова. Ожидание видео...</div>
    </div>

    <!-- Результат -->
    <div class="result-area" id="resultArea">
        <div class="card">
            <h3 style="margin-top:0">Готово!</h3>
            <p style="font-size:12px; color:var(--text-dim)">Найдено лучших моментов: <span id="clipCount" style="color:white; font-weight:bold">0</span></p>
            
            <!-- Превью первого клипа -->
            <video id="previewVideo" controls class="video-preview"></video>
            
            <div style="margin-top: 15px; display:flex; flex-direction:column; gap:10px;">
                <a id="downloadZipBtn" class="btn-download zip">📦 Скачать все клипы (ZIP)</a>
                <a id="downloadSingleBtn" class="btn-download">💾 Скачать первый клип (MP4)</a>
            </div>
        </div>
    </div>
</div>

<video id="hiddenVideo" muted playsinline></video>
<canvas id="hiddenCanvas"></canvas>

<script>
    const { createFFmpeg, fetchFile } = FFmpeg;
    
    // Инициализация FFmpeg (без SharedArrayBuffer)
    const ffmpeg = createFFmpeg({ 
        log: true,
        corePath: 'https://unpkg.com/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js'
    });

    let selectedFile = null;
    let outputFormat = 'vertical'; // vertical или horizontal
    let generatedClips = []; // Хранилище бинарных данных клипов

    // --- Логирование ---
    function log(msg, type = 'info') {
        const win = document.getElementById('logWindow');
        const div = document.createElement('div');
        div.className = `log-entry log-${type}`;
        div.innerText = `> ${msg}`;
        win.appendChild(div);
        win.scrollTop = win.scrollHeight;
    }

    // --- Выбор формата ---
    function setFormat(fmt) {
        outputFormat = fmt;
        document.querySelectorAll('.format-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`btn-${fmt}`).classList.add('active');
        log(`Формат изменен на: ${fmt === 'vertical' ? 'Вертикальный (TikTok)' : 'Горизонтальный (YouTube)'}`);
    }

    // --- Загрузка файла ---
    document.getElementById('fileInput').addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
            selectedFile = e.target.files[0];
            document.getElementById('fileName').innerText = selectedFile.name;
            document.getElementById('startBtn').classList.add('ready');
            log(`Файл загружен: ${(selectedFile.size / 1024 / 1024).toFixed(2)} MB`, 'success');
        }
    });

    // --- Анализ видео (FaceAPI) ---
    async function analyzeVideoSegments(videoElement) {
        log('Загрузка нейросетей лица...', 'info');
        
        // Ждем загрузки моделей face-api
        await faceapi.nets.tinyFaceDetector.loadFromUri('https://justadudewhohacks.github.io/face-api.js/models');
        await faceapi.nets.faceExpressionNet.loadFromUri('https://justadudewhohacks.github.io/face-api.js/models');
        
        log('Нейросети готовы. Сканирование видео...', 'info');

        const duration = videoElement.duration;
        const segmentDuration = 3; // Проверяем каждые 3 секунды
        const goodSegments = [];
        
        const canvas = document.getElementById('hiddenCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 320; // Уменьшаем для скорости
        canvas.height = 320 * (videoElement.videoHeight / videoElement.videoWidth);

        let currentTime = 0;
        
        // Пропускаем видео быстро, проверяя кадры
        while (currentTime < duration) {
            videoElement.currentTime = currentTime;
            
            // Ждем обновления кадра
            await new Promise(r => {
                const onSeeked = () => {
                    videoElement.removeEventListener('seeked', onSeeked);
                    r();
                };
                videoElement.addEventListener('seeked', onSeeked);
            });

            // Рисуем кадр на канвас
            ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
            
            // Детекция
            const detections = await faceapi.detectAllFaces(canvas, new faceapi.TinyFaceDetectorOptions()).withFaceExpressions();
            
            if (detections.length > 0) {
                // Если есть лицо, проверяем эмоции
                const expressions = detections[0].expressions;
                const neutralScore = expressions.neutral;
                const happyScore = expressions.happy;
                const surprisedScore = expressions.surprised;

                // Логика: если лицо есть и оно не слишком скучное (нейтральность < 0.8) или счастливое
                if (happyScore > 0.1 || surprisedScore > 0.1 || neutralScore < 0.85) {
                    goodSegments.push({ start: currentTime, score: happyScore + surprisedScore });
                    log(`Найден момент: ${currentTime.toFixed(1)}с (Эмоции активны)`);
                }
            }

            currentTime += segmentDuration;
            
            // Оптимизация: не сканируем бесконечно долго для демо
            if (currentTime > 120) { 
                log('Достигнут лимит анализа (2 мин) для ускорения.', 'warn');
                break; 
            }
        }

        return goodSegments;
    }

    // --- Основной процесс ---
    async function startProcess() {
        if (!selectedFile) return;

        const btn = document.getElementById('startBtn');
        const btnText = btn.querySelector('.btn-text');
        const loader = document.getElementById('btnLoader');
        
        btnText.style.display = 'none';
        loader.style.display = 'block';
        btn.disabled = true;

        try {
            // 1. Инициализация FFmpeg
            if (!ffmpeg.isLoaded()) {
                log('Инициализация видеоядра...', 'info');
                await ffmpeg.load();
            }

            // 2. Подготовка видео
            log('Подготовка видеофайла...', 'info');
            ffmpeg.FS('writeFile', 'input.mp4', await fetchFile(selectedFile));

            // 3. Анализ контента (AI)
            const videoEl = document.getElementById('hiddenVideo');
            videoEl.src = URL.createObjectURL(selectedFile);
            await new Promise(r => videoEl.onloadeddata = r);
            
            const segments = await analyzeVideoSegments(videoEl);
            
            if (segments.length === 0) {
                throw new Error('Лица не найдены или видео слишком темное/статичное.');
            }

            // 4. Генерация клипов
            log(`Найдено ${segments.length} перспективных моментов. Нарезка...`, 'info');
            generatedClips = [];
            const zip = new JSZip();
            
            // Параметры кропа
            let filterComplex = '';
            let outputSize = '';
            
            if (outputFormat === 'vertical') {
                // Crop to center vertical 9:16
                filterComplex = 'crop=ih*(9/16):ih'; 
                outputSize = '720x1280';
            } else {
                // Just scale to 720p horizontal
                filterComplex = 'scale=1280:720';
                outputSize = '1280x720';
            }

            for (let i = 0; i < segments.length; i++) {
                const seg = segments[i];
                const clipName = `clip_${i+1}.mp4`;
                const duration = 15; // Длительность одного клипа 15 сек
                
                log(`Обработка клипа ${i+1} (начало: ${seg.start.toFixed(1)}с)...`, 'info');

                // Команда FFmpeg: вырезать кусок, обрезать под формат, улучшить цвет
                await ffmpeg.run(
                    '-ss', seg.start.toString(),
                    '-t', duration.toString(),
                    '-i', 'input.mp4',
                    '-vf', `${filterComplex},eq=brightness=0.05:saturation=1.1`, // Легкий люк
                    '-c:v', 'libx264',
                    '-preset', 'ultrafast', // Быстрее для браузера
                    '-c:a', 'aac',
                    clipName
                );

                const data = ffmpeg.FS('readFile', clipName);
                
                // Сохраняем в массив для превью первого
                if (i === 0) {
                    const blob = new Blob([data.buffer], { type: 'video/mp4' });
                    const url = URL.createObjectURL(blob);
                    document.getElementById('previewVideo').src = url;
                    document.getElementById('downloadSingleBtn').href = url;
                    document.getElementById('downloadSingleBtn').download = 'best_moment.mp4';
                }

                // Добавляем в ZIP
                zip.file(clipName, data);
                generatedClips.push(data);
                
                // Чистим память FFmpeg
                ffmpeg.FS('unlink', clipName);
            }

            // 5. Финал
            log('Упаковка архива...', 'success');
            const content = await zip.generateAsync({ type: "blob" });
            const zipUrl = URL.createObjectURL(content);
            
            const zipBtn = document.getElementById('downloadZipBtn');
            zipBtn.href = zipUrl;
            zipBtn.download = "smart_edits.zip";

            document.getElementById('clipCount').innerText = segments.length;
            document.getElementById('resultArea').style.display = 'flex';
            log('Монтаж завершен! Скачивайте файлы.', 'success');

        } catch (err) {
            console.error(err);
            log(`Ошибка: ${err.message}`, 'error');
            if (err.message.includes('SharedArrayBuffer')) {
                log('Критическая ошибка браузера. Попробуйте Chrome на ПК.', 'error');
            }
        } finally {
            btnText.style.display = 'block';
            loader.style.display = 'none';
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
