<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartEditor Pro | AI Video Editor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f0f1a;
            --card-bg: #1a1a2e;
            --primary-gradient: linear-gradient(90deg, #d946ef, #ec4899);
            --accent-green: #84cc16;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 1px solid #333;
        }

        .brand {
            font-size: 20px;
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .api-box {
            background: #151525;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #333;
        }
        .api-box label { font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 5px; }
        .api-input { width: 100%; background: #0f0f1a; border: 1px solid #444; padding: 10px; border-radius: 6px; color: #fff; font-family: monospace; box-sizing: border-box; }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 30px 20px;
            text-align: center;
            border: 1px solid #333;
        }

        .upload-area {
            border: 2px dashed #444;
            border-radius: 12px;
            padding: 40px 20px;
            margin-bottom: 20px;
            cursor: pointer;
            transition: 0.3s;
        }
        .upload-area:hover { border-color: #d946ef; background: rgba(217, 70, 239, 0.05); }

        h3 { margin: 10px 0 5px; }
        .sub-text { color: var(--text-muted); font-size: 13px; margin-bottom: 15px; display: block; }

        .btn-action {
            background: var(--primary-gradient);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(217, 70, 239, 0.3);
        }
        .btn-action:disabled { background: #444; cursor: not-allowed; box-shadow: none; }

        #fileInput { display: none; }
        #hiddenVideo { display: none; }

        .file-list {
            text-align: left;
            margin-top: 10px;
            max-height: 150px;
            overflow-y: auto;
            border-top: 1px solid #333;
            padding-top: 10px;
        }
        .file-item {
            background: #252540;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 5px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
        }

        .log-area {
            background: #111;
            padding: 15px;
            border-radius: 10px;
            font-family: monospace;
            font-size: 12px;
            color: #aaa;
            height: 180px;
            overflow-y: auto;
            border: 1px solid #333;
        }
        .log-success { color: var(--accent-green); }
        .log-error { color: #ef4444; }
        .log-ai { color: #d946ef; font-weight: bold; }
        .log-process { color: #3b82f6; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div class="brand">SmartEditor <span style="font-size: 10px; opacity: 0.7;">PRO</span></div>
    </div>

    <div class="api-box">
        <label>🔑 API Ключ (Оставьте любой, если нет ключа - сработает Демо-режим):</label>
        <input type="text" id="apiKey" class="api-input" placeholder="AIzaSy... (или AQ...)">
    </div>

    <div class="card">
        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
            <div style="font-size: 30px;">📂</div>
            <h3>Загрузить файлы</h3>
            <span class="sub-text">Работает с большими видео (анализ по кадрам)</span>
        </div>
        
        <input type="file" id="fileInput" accept="video/*, image/*" multiple>
        
        <div id="fileListContainer" style="display:none;">
            <p class="sub-text">Файлов: <span id="fileCount" class="file-count" style="color:var(--accent-green); font-weight:bold;">0</span></p>
            <div class="file-list" id="fileList"></div>
        </div>
        <br>
        <button id="processBtn" class="btn-action" disabled onclick="processBatch()">
            🧠 Анализировать всё
        </button>
    </div>

    <div class="log-area" id="logs">
        > Система готова...
    </div>
</div>

<video id="hiddenVideo" muted playsinline></video>
<canvas id="captureCanvas" style="display:none;"></canvas>

<script>
    const fileInput = document.getElementById('fileInput');
    const processBtn = document.getElementById('processBtn');
    const logs = document.getElementById('logs');
    const apiKeyInput = document.getElementById('apiKey');
    const fileListContainer = document.getElementById('fileListContainer');
    const fileListDiv = document.getElementById('fileList');
    const fileCountSpan = document.getElementById('fileCount');
    const videoPlayer = document.getElementById('hiddenVideo');
    const canvas = document.getElementById('captureCanvas');
    const ctx = canvas.getContext('2d');

    fileInput.addEventListener('change', function() {
        const files = this.files;
        fileListDiv.innerHTML = '';
        if (files.length > 0) {
            fileListContainer.style.display = 'block';
            processBtn.disabled = false;
            fileCountSpan.innerText = files.length;
            for (let i = 0; i < files.length; i++) {
                const item = document.createElement('div');
                item.className = 'file-item';
                let name = files[i].name.length > 30 ? files[i].name.substring(0, 15) + '...' : files[i].name;
                item.innerHTML = `<span>📄 ${name}</span> <span>${(files[i].size / 1024 / 1024).toFixed(1)} MB</span>`;
                fileListDiv.appendChild(item);
            }
            addLog(`✅ Выбрано: ${files.length} файлов.`);
        } else {
            fileListContainer.style.display = 'none';
            processBtn.disabled = true;
        }
    });

    function addLog(text, type = '') {
        const p = document.createElement('div');
        p.innerText = '> ' + text;
        if (type) p.className = type;
        logs.appendChild(p);
        logs.scrollTop = logs.scrollHeight;
    }

    async function processBatch() {
        processBtn.disabled = true;
        processBtn.innerText = "🧠 ИИ анализирует...";
        addLog("🚀 Запуск обработки...");

        for (let i = 0; i < fileInput.files.length; i++) {
            const file = fileInput.files[i];
            addLog(`🔄 Обработка #${i+1}: ${file.name}...`);

            try {
                if (file.type.startsWith('video/')) {
                    await analyzeVideoSmart(file, apiKeyInput.value, i + 1);
                } else if (file.type.startsWith('image/')) {
                    // Пропустим фото для теста видео, чтобы не усложнять
                    addLog("⏳ Фото пропущено (в этом обновлении тест видео)");
                }
                await new Promise(r => setTimeout(r, 1000));
            } catch (error) {
                addLog(`❌ Ошибка: ${error.message}`, "log-error");
            }
        }
        addLog("🏁 Готово!", "log-success");
        processBtn.innerText = "Готово!";
        processBtn.disabled = false;
    }

    async function analyzeVideoSmart(file, apiKey, index) {
        addLog(`🎬 Извлекаем кадры из видео...`, "log-process");
        const url = URL.createObjectURL(file);
        videoPlayer.src = url;
        await new Promise(r => videoPlayer.onloadedmetadata = r);

        const duration = videoPlayer.duration;
        const interval = Math.max(10, duration / 10); // 1 кадр каждые 10 сек или всего 10 кадров
        const frames = [];
        let currentTime = 0;

        while (currentTime <= duration) {
            await seekTo(videoPlayer, currentTime);
            canvas.width = videoPlayer.videoWidth;
            canvas.height = videoPlayer.videoHeight;
            ctx.drawImage(videoPlayer, 0, 0, canvas.width, canvas.height);
            const frameBase64 = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];
            frames.push({ time: currentTime, data: frameBase64 });
            currentTime += interval;
            // Не спамим логи
            if(currentTime % 30 === 0) addLog(`   > Обработан кадр ${currentTime.toFixed(1)}с`);
        }
        
        URL.revokeObjectURL(url);
        videoPlayer.src = "";
        addLog(`✨ Снято ${frames.length} кадров. Отправка в ИИ...`, "log-success");

        // Пытаемся отправить в ИИ, ЕСЛИ НЕ ПОЛУЧИТСЯ - ВКЛЮЧАЕМ ДЕМО РЕЖИМ
        try {
            const response = await sendToGemini(apiKey, frames.map(f => f.data), `Анализируй ${frames.length} кадров. Верни JSON: { "mood": "...", "best_frame": 1 }`);
            addLog(`✅ ИИ ответил:`, "log-success");
            addLog(response, "log-ai");
        } catch (e) {
            // ДЕМО РЕЖИМ (Если ключ не работает)
            addLog("⚠️ API недоступен. Запуск ДЕМО РЕЖИМА (Имитация ИИ)...", "log-process");
            // Имитация задержки мышления ИИ
            setTimeout(() => {
                const demoResponse = JSON.stringify({
                    "mood": "веселый и динамичный",
                    "best_moment_frame": Math.floor(Math.random() * frames.length) + 1,
                    "tags": ["природа", "движение", "солнце"],
                    "recommendation": "Рекомендую вырезать начало и сделать музыку громче."
                });
                addLog(`✅ ДЕМО ОТВЕТ:`, "log-ai");
                addLog(demoResponse, "log-ai");
            }, 2000);
        }
    }

    function seekTo(video, time) {
        return new Promise(resolve => {
            video.currentTime = Math.min(time, video.duration - 0.1);
            video.onseeked = resolve;
        });
    }

    async function sendToGemini(apiKey, imagesData, prompt) {
        // Используем надежную модель
        const apiURL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
        const parts = [{ text: prompt }];
        imagesData.forEach(imgData => parts.push({ inline_data: { mime_type: 'image/jpeg', data: imgData } }));
        const requestBody = { contents: [{ parts: parts }] };

        const response = await fetch(apiURL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(requestBody)
        });

        if (!response.ok) {
            const err = await response.json().catch(() => ({}));
            throw new Error(err.error?.message || "Ошибка API");
        }
        const data = await response.json();
        return data.candidates[0].content.parts[0].text;
    }
</script>

</body>
</html>
