<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartEditor Pro | Video Analyzer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f0f1a;
            --card-bg: #1a1a2e;
            --primary-gradient: linear-gradient(90deg, #d946ef, #ec4899);
            --accent-green: #84cc16;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 1px solid #333;
        }

        .brand {
            font-size: 20px;
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .api-box {
            background: #151525;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #333;
        }
        .api-box label { font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 5px; }
        .api-input { width: 100%; background: #0f0f1a; border: 1px solid #444; padding: 10px; border-radius: 6px; color: #fff; font-family: monospace; box-sizing: border-box; }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 30px 20px;
            text-align: center;
            border: 1px solid #333;
        }

        .upload-area {
            border: 2px dashed #444;
            border-radius: 12px;
            padding: 40px 20px;
            margin-bottom: 20px;
            cursor: pointer;
            transition: 0.3s;
        }
        .upload-area:hover { border-color: #d946ef; background: rgba(217, 70, 239, 0.05); }

        h3 { margin: 10px 0 5px; }
        .sub-text { color: var(--text-muted); font-size: 13px; margin-bottom: 15px; display: block; }

        .btn-action {
            background: var(--primary-gradient);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(217, 70, 239, 0.3);
        }
        .btn-action:disabled { background: #444; cursor: not-allowed; box-shadow: none; }

        #fileInput { display: none; }

        /* Скрываем плеер, он нужен только для анализа */
        #hiddenVideo { display: none; }

        .file-list {
            text-align: left;
            margin-top: 10px;
            max-height: 150px;
            overflow-y: auto;
            border-top: 1px solid #333;
            padding-top: 10px;
        }
        .file-item {
            background: #252540;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 5px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
        }

        .log-area {
            background: #111;
            padding: 15px;
            border-radius: 10px;
            font-family: monospace;
            font-size: 12px;
            color: #aaa;
            height: 180px;
            overflow-y: auto;
            border: 1px solid #333;
        }
        .log-success { color: var(--accent-green); }
        .log-error { color: #ef4444; }
        .log-ai { color: #d946ef; font-weight: bold; }
        .log-process { color: #3b82f6; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div class="brand">SmartEditor <span style="font-size: 10px; opacity: 0.7;">PRO</span></div>
    </div>

    <div class="api-box">
        <label>🔑 API Ключ Google Gemini:</label>
        <input type="text" id="apiKey" class="api-input" placeholder="AIzaSy...">
    </div>

    <div class="card">
        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
            <div style="font-size: 30px;">📂</div>
            <h3>Загрузить файлы</h3>
            <span class="sub-text">Работает с большими видео (анализ по кадрам)</span>
        </div>
        
        <input type="file" id="fileInput" accept="video/*, image/*" multiple>
        
        <div id="fileListContainer" style="display:none;">
            <p class="sub-text">Файлов: <span id="fileCount" class="file-count" style="color:var(--accent-green); font-weight:bold;">0</span></p>
            <div class="file-list" id="fileList"></div>
        </div>
        <br>
        <button id="processBtn" class="btn-action" disabled onclick="processBatch()">
            🧠 Анализировать всё
        </button>
    </div>

    <div class="log-area" id="logs">
        > Система готова...
    </div>
</div>

<!-- Скрытый видео элемент для анализа -->
<video id="hiddenVideo" muted playsinline></video>
<!-- Скрытый холст для отрисовки кадров -->
<canvas id="captureCanvas" style="display:none;"></canvas>

<script>
    const fileInput = document.getElementById('fileInput');
    const processBtn = document.getElementById('processBtn');
    const logs = document.getElementById('logs');
    const apiKeyInput = document.getElementById('apiKey');
    const fileListContainer = document.getElementById('fileListContainer');
    const fileListDiv = document.getElementById('fileList');
    const fileCountSpan = document.getElementById('fileCount');
    
    // Инструменты для анализа
    const videoPlayer = document.getElementById('hiddenVideo');
    const canvas = document.getElementById('captureCanvas');
    const ctx = canvas.getContext('2d');

    fileInput.addEventListener('change', function() {
        const files = this.files;
        fileListDiv.innerHTML = '';
        
        if (files.length > 0) {
            fileListContainer.style.display = 'block';
            processBtn.disabled = false;
            fileCountSpan.innerText = files.length;
            
            for (let i = 0; i < files.length; i++) {
                const item = document.createElement('div');
                item.className = 'file-item';
                let name = files[i].name.length > 30 ? files[i].name.substring(0, 15) + '...' : files[i].name;
                item.innerHTML = `<span>📄 ${name}</span> <span>${(files[i].size / 1024 / 1024).toFixed(1)} MB</span>`;
                fileListDiv.appendChild(item);
            }
            addLog(`✅ Выбрано: ${files.length} файлов.`);
        } else {
            fileListContainer.style.display = 'none';
            processBtn.disabled = true;
        }
    });

    function addLog(text, type = '') {
        const p = document.createElement('div');
        p.innerText = '> ' + text;
        if (type) p.className = type;
        logs.appendChild(p);
        logs.scrollTop = logs.scrollHeight;
    }

    // --- ГЛАВНАЯ ЛОГИКА ---

    async function processBatch() {
        const apiKey = apiKeyInput.value.trim();
        if (!apiKey) {
            addLog("❌ ОШИБКА: Введите API ключ!", "log-error");
            return;
        }

        const files = fileInput.files;
        processBtn.disabled = true;
        processBtn.innerText = "🧠 ИИ анализирует...";
        
        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            addLog(`🔄 Обработка #${i+1}: ${file.name}...`);

            try {
                // Проверка типа файла
                if (file.type.startsWith('video/')) {
                    // === РЕЖИМ ВИДЕО (Умная выборка кадров) ===
                    await analyzeVideoSmart(file, apiKey, i + 1);
                } else if (file.type.startsWith('image/')) {
                    // === РЕЖИМ ФОТО (Прямая отправка) ===
                    await analyzeImage(file, apiKey, i + 1);
                } else {
                    addLog(`⚠️ Пропускаем невидео файл: ${file.name}`);
                }
                
                await new Promise(r => setTimeout(r, 1500)); // Пауза между файлами

            } catch (error) {
                addLog(`❌ Ошибка #${i+1}: ${error.message}`, "log-error");
            }
        }

        addLog("🏁 Вся очередь завершена!", "log-success");
        processBtn.innerText = "Готово!";
        processBtn.disabled = false;
    }

    // Функция 1: Анализ Фото (обычный)
    async function analyzeImage(file, apiKey, index) {
        const base64Data = await fileToBase64(file);
        const prompt = `Это фото. Опиши настроение и найди ключевые объекты. Верни JSON: { "mood": "...", "tags": [] }`;
        const response = await sendToGemini(apiKey, [base64Data], prompt, file.type);
        const result = JSON.parse(response);
        addLog(`✅ Фото #${index} готово:`, "log-success");
        addLog(JSON.stringify(result), "log-ai");
    }

    // Функция 2: Умный анализ ВИДЕО (Раскадровка)
    async function analyzeVideoSmart(file, apiKey, index) {
        addLog(`🎬 Видео! Раскадровываем (извлекаем ключевые кадры)...`, "log-process");
        
        // 1. Создаем временную ссылку на файл
        const url = URL.createObjectURL(file);
        videoPlayer.src = url;
        
        // 2. Ждем загрузки метаданных (чтобы узнать длину)
        await new Promise((resolve) => {
            videoPlayer.onloadedmetadata = resolve;
        });

        const duration = videoPlayer.duration;
        // Берем кадры каждые 10 секунд, но не больше 10 кадров, чтобы не перегрузить API
        const interval = Math.max(10, duration / 10); 
        const frames = [];
        let currentTime = 0;

        // 3. Цикл: Перематываем видео -> Ждем -> Делаем снимок
        while (currentTime <= duration) {
            await seekTo(videoPlayer, currentTime);
            
            // Рисуем текущий кадр на Canvas
            canvas.width = videoPlayer.videoWidth;
            canvas.height = videoPlayer.videoHeight;
            ctx.drawImage(videoPlayer, 0, 0, canvas.width, canvas.height);
            
            // Сохраняем снимок (JPEG, сжимая до 80% качества)
            const frameBase64 = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];
            frames.push({ time: currentTime, data: frameBase64 });
            
            currentTime += interval;
            addLog(`   > Кадр ${currentTime.toFixed(1)}с готов.`);
        }
        
        // Очищаем память
        URL.revokeObjectURL(url);
        videoPlayer.src = "";
        addLog(`✨ Видео обработано! Снято ${frames.length} ключевых кадров.`, "log-success");

        // 4. Отправляем кадры в ИИ
        const framesData = frames.map(f => f.data);
        // Создаем текстовое описание временных меток для ИИ
        const timestampsInfo = frames.map((f, i) => `Frame ${i+1} is at ${f.time.toFixed(1)}s`).join('. ');
        
        const prompt = `Ты видишь ${frames.length} кадров из одного видео. ${timestampsInfo}. 
        Задача: Проанализируй визуальный ряд и верни JSON с общими рекомендациями для монтажа этого видео.
        JSON пример: { "vibe": "динамичный", "best_moment_frame": 3, "suggested_music": "electronic" }`;

        const response = await sendToGemini(apiKey, framesData, prompt, 'image/jpeg');
        addLog(`✅ Анализ видео #${index} готов:`, "log-success");
        addLog(response, "log-ai");
    }

    // Вспомогательная: Перематывание видео
    function seekTo(video, time) {
        return new Promise(resolve => {
            video.currentTime = Math.min(time, video.duration - 0.1); // -0.1 чтобы не зависнуть на конце
            video.onseeked = resolve;
        });
    }

    // Вспомогательная: Файл в Base64
    function fileToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.onerror = reject;
        });
    }

    // Вспомогательная: Отправка в Gemini
    async function sendToGemini(apiKey, imagesData, prompt, mimeType) {
        const apiURL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
        
        // Формируем части запроса (Текст + Картинки)
        const parts = [{ text: prompt }];
        imagesData.forEach(imgData => {
            parts.push({ inline_data: { mime_type: mimeType, data: imgData } });
        });

        const requestBody = { contents: [{ parts: parts }] };

        const response = await fetch(apiURL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(requestBody)
        });

        if (!response.ok) {
            const err = await response.json().catch(() => ({}));
            throw new Error(err.error?.message || "Ошибка API");
        }

        const data = await response.json();
        return data.candidates[0].content.parts[0].text;
    }

</script>

</body>
</html>
