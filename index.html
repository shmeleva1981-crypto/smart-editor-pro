!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SmartEditor Pro | AI Video Cutter</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- Stable FFmpeg version (0.11.6) that works on GitHub Pages -->
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
    <!-- Face API -->
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

    <style>
        :root {
            --bg-color: #050510;
            --card-bg: #13132b;
            --primary: #d946ef;
            --secondary: #8b5cf6;
            --accent: #10b981;
            --text: #ffffff;
            --text-dim: #9ca3af;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 10px;
        }
        .brand {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Card Styles */
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #2a2a40;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        /* Format Selector */
        .format-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .format-btn {
            flex: 1;
            padding: 12px;
            background: #2a2a40;
            border: 2px solid transparent;
            border-radius: 10px;
            color: var(--text-dim);
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
        }
        .format-btn.active {
            border-color: var(--primary);
            background: rgba(217, 70, 239, 0.1);
            color: var(--text);
        }

        /* Upload Area */
        .upload-area {
            border: 2px dashed #444;
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            position: relative;
        }
        .upload-area:hover { border-color: var(--primary); background: rgba(217, 70, 239, 0.05); }
        .upload-icon { font-size: 40px; margin-bottom: 10px; display: block; }
        
        /* Logs */
        .log-box {
            background: #000;
            border-radius: 8px;
            padding: 10px;
            height: 150px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 11px;
            color: #ccc;
            border: 1px solid #333;
        }
        .log-entry { margin-bottom: 4px; }
        .log-ai { color: var(--primary); }
        .log-success { color: var(--accent); }
        .log-warn { color: #fbbf24; }

        /* Buttons */
        .btn-main {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(217, 70, 239, 0.4);
            transition: transform 0.1s;
        }
        .btn-main:active { transform: scale(0.98); }
        .btn-main:disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(1); }

        /* Result */
        .result-area {
            display: none;
            text-align: center;
            animation: slideUp 0.4s ease;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        video.result-video {
            width: 100%;
            border-radius: 12px;
            margin-bottom: 15px;
            background: #000;
        }

        .hidden { display: none; }
        
        /* Progress Bar */
        .progress-container {
            width: 100%;
            background: #333;
            height: 6px;
            border-radius: 3px;
            margin-top: 10px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.3s;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div class="brand">SmartEditor Pro</div>
        <div style="font-size: 12px; color: var(--text-dim); margin-top: 5px;">AI Powered Mobile Cutter</div>
    </div>

    <!-- Settings -->
    <div class="card">
        <label style="font-size: 12px; color: var(--text-dim); display: block; margin-bottom: 8px;">ФОРМАТ ВЫХОДА:</label>
        <div class="format-selector">
            <div class="format-btn active" onclick="setFormat('vertical')" id="btn-vertical">
                📱 Вертикально<br><span style="font-size:10px; opacity:0.7">(TikTok/Reels)</span>
            </div>
            <div class="format-btn" onclick="setFormat('horizontal')" id="btn-horizontal">
                🖥️ Горизонтально<br><span style="font-size:10px; opacity:0.7">(YouTube)</span>
            </div>
        </div>

        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
            <span class="upload-icon">📁</span>
            <div id="fileName">Нажми, чтобы выбрать видео</div>
            <div style="font-size: 11px; color: var(--text-dim); margin-top: 5px;">Поддерживаются длинные видео (до 5 мин)</div>
            <input type="file" id="fileInput" accept="video/*" class="hidden" onchange="handleFileSelect(event)">
        </div>
    </div>

    <!-- Action -->
    <button id="startBtn" class="btn-main" onclick="startProcess()" disabled>
        🚀 Запустить AI Монтаж
    </button>

    <!-- Logs -->
    <div class="card">
        <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
            <span style="font-size:12px; font-weight:bold;">СТАТУС ПРОЦЕССА</span>
            <span id="statusText" style="font-size:12px; color:var(--primary);">Ожидание...</span>
        </div>
        <div class="log-box" id="logBox"></div>
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
    </div>

    <!-- Result -->
    <div class="card result-area" id="resultArea">
        <h3 style="margin:0 0 10px 0; color:var(--accent);">Готово! 🎉</h3>
        <video id="outputVideo" controls class="result-video"></video>
        <a id="downloadLink" class="btn-main" style="display:block; text-decoration:none; text-align:center; box-sizing:border-box;">
            💾 Скачать MP4
        </a>
        <button onclick="location.reload()" style="background:none; border:none; color:var(--text-dim); margin-top:15px; cursor:pointer; text-decoration:underline;">
            Обработать другое видео
        </button>
    </div>
</div>

<!-- Hidden Elements for Processing -->
<video id="sourceVideo" playsinline muted></video>
<canvas id="analysisCanvas" style="display:none;"></canvas>

<script>
    const { createFFmpeg, fetchFile } = FFmpeg;
    let ffmpeg = null;
    let selectedFile = null;
    let outputFormat = 'vertical'; // 'vertical' or 'horizontal'
    
    // Настройки для оптимизации длинных видео
    const CONFIG = {
        maxDuration: 60, // Максимальная длина итогового ролика (сек)
        sampleInterval: 1500, // Анализировать кадр каждые 1.5 сек (чтобы не висло)
        targetWidth: 720, // Сжимаем входное видео до 720p для скорости
        confidenceThreshold: 0.6 // Порог уверенности детекции лица
    };

    function log(msg, type = 'info') {
        const box = document.getElementById('logBox');
        const div = document.createElement('div');
        div.className = 'log-entry';
        if (type === 'ai') div.classList.add('log-ai');
        if (type === 'success') div.classList.add('log-success');
        if (type === 'warn') div.classList.add('log-warn');
        div.innerText = `> ${msg}`;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    function setFormat(fmt) {
        outputFormat = fmt;
        document.querySelectorAll('.format-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`btn-${fmt}`).classList.add('active');
        log(`Формат изменен на: ${fmt === 'vertical' ? '9:16 (Вертикально)' : '16:9 (Горизонтально)'}`);
    }

    function handleFileSelect(event) {
        const file = event.target.files[0];
        if (!file) return;
        
        // Проверка размера (предупреждение для очень больших файлов)
        if (file.size > 100 * 1024 * 1024) {
            log(`Внимание: Файл большой (${(file.size/1024/1024).toFixed(1)} MB). Обработка может занять время.`, 'warn');
        }

        selectedFile = file;
        document.getElementById('fileName').innerText = file.name;
        document.getElementById('startBtn').disabled = false;
        log('Файл загружен. Готов к анализу.', 'success');
    }

    async function initFFmpeg() {
        if (ffmpeg) return;
        log('Инициализация видеодвижка...');
        ffmpeg = createFFmpeg({ log: false });
        await ffmpeg.load();
        log('Видеодвижок готов.', 'success');
    }

    async function loadModels() {
        log('Загрузка нейросетей (FaceAPI)...');
        const MODEL_URL = 'https://justadudewhohacks.github.io/face-api.js/models';
        
        await Promise.all([
            faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
            faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
            faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL)
        ]);
        log('Нейросети загружены.', 'success');
    }

    async function analyzeVideo(videoElement) {
        log('Начало анализа видеокадров...', 'ai');
        const canvas = document.getElementById('analysisCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        
        // Устанавливаем размер канваса равным видео
        canvas.width = videoElement.videoWidth;
        canvas.height = videoElement.videoHeight;

        const duration = videoElement.duration;
        const segments = [];
        let currentTime = 0;

        // Пропускаем видео с шагом sampleInterval
        while (currentTime < duration && segments.length < 20) { // Лимит сегментов для производительности
            videoElement.currentTime = currentTime;
            
            // Ждем обновления кадра
            await new Promise(r => {
                const handler = () => {
                    videoElement.removeEventListener('seeked', handler);
                    r();
                };
                videoElement.addEventListener('seeked', handler);
            });

            ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
            
            // Детекция лица
            const detections = await faceapi.detectAllFaces(canvas, new faceapi.TinyFaceDetectorOptions());
            
            if (detections.length > 0) {
                // Нашли лицо! Это хороший момент.
                // Берем эмоцию самого крупного лица
                const withExpressions = await faceapi.detectFaceExpressions(canvas, detections[0].box);
                const expressions = withExpressions.expressions;
                
                // Ищем самую сильную положительную эмоцию или просто наличие лица
                let score = 0.5; // Базовый балл за наличие лица
                if (expressions.happy > 0.5) score += 0.3;
                if (expressions.surprised > 0.5) score += 0.2;
                if (expressions.neutral > 0.8) score += 0.1; // Нейтральная речь тоже важна

                segments.push({
                    start: Math.max(0, currentTime - 1), // Начинаем чуть раньше
                    end: Math.min(duration, currentTime + 2), // Берем 3 секунды вокруг момента
                    score: score
                });
                
                log(`Кадр ${currentTime.toFixed(1)}с: Лицо найдено (Эмоция: ${Object.keys(expressions).reduce((a, b) => expressions[a] > expressions[b] ? a : b)})`, 'ai');
            }

            currentTime += (CONFIG.sampleInterval / 1000);
        }

        // Если ничего не нашли, берем случайные куски из начала, середины и конца
        if (segments.length === 0) {
            log('Лица не найдены. Используем умную нарезку по времени.', 'warn');
            const step = duration / 5;
            for(let i=0; i<5; i++) {
                segments.push({
                    start: i * step,
                    end: Math.min(duration, (i * step) + 3),
                    score: 0.5
                });
            }
        }

        // Сортируем по важности и обрезаем до макс. длительности
        segments.sort((a, b) => b.score - a.score);
        
        let finalDuration = 0;
        const selectedSegments = [];
        
        for (let seg of segments) {
            const segLen = seg.end - seg.start;
            if (finalDuration + segLen <= CONFIG.maxDuration) {
                selectedSegments.push(seg);
                finalDuration += segLen;
            }
            if (finalDuration >= CONFIG.maxDuration * 0.8) break; // Хватит
        }

        // Сортируем выбранные сегменты по времени, чтобы сохранить хронологию
        selectedSegments.sort((a, b) => a.start - b.start);

        log(`Выбрано ${selectedSegments.length} лучших моментов.`, 'success');
        return selectedSegments;
    }

    async function startProcess() {
        if (!selectedFile) return;
        
        const btn = document.getElementById('startBtn');
        btn.disabled = true;
        btn.innerText = "Обработка...";
        
        try {
            await initFFmpeg();
            await loadModels();

            const videoEl = document.getElementById('sourceVideo');
            videoEl.src = URL.createObjectURL(selectedFile);
            
            await new Promise(resolve => {
                videoEl.onloadedmetadata = () => {
                    log(`Видео загружено: ${videoEl.videoWidth}x${videoEl.videoHeight}, ${videoEl.duration.toFixed(1)}с`);
                    resolve();
                };
            });

            // 1. Анализ
            const segments = await analyzeVideo(videoEl);
            if (segments.length === 0) throw new Error("Не удалось найти подходящие фрагменты");

            // 2. Подготовка FFmpeg
            log('Конвертация видео для монтажа...');
            const inputName = 'input.mp4';
            ffmpeg.FS('writeFile', inputName, await fetchFile(selectedFile));

            // 3. Сборка команд для фильтра complex
            // Мы будем использовать фильтр select и concat
            // Для упрощения и надежности на мобильных сделаем так:
            // Создадим список временных файлов для каждого сегмента, потом склеим.
            // НО для экономии памяти сделаем один сложный фильтр.
            
            let filterComplex = "";
            let inputs = "";
            
            // Определяем параметры кропа
            let cropFilter = "";
            if (outputFormat === 'vertical') {
                // Crop center square-ish then scale to 720x1280
                cropFilter = `crop=min(iw\\,ih):min(iw\\,ih),scale=720:1280`;
            } else {
                // Scale to 1280x720
                cropFilter = `scale=1280:720`;
            }

            // Формируем фильтр для выбора сегментов и наложения эффектов
            // select='between(t,start,end)'
            let selectParts = [];
            segments.forEach((seg, index) => {
                selectParts.push(`select='between(t,${seg.start},${seg.end})'`);
            });
            
            // Объединяем через concat
            // Важно: для аудио тоже нужно сделать select
            const concatSegs = segments.length;
            
            // Полный фильтр:
            // [0:v] select=..., setpts=PTS-STARTPTS, crop..., fade ... [v]
            // [0:a] aselect=..., asetpts=PTS-STARTPTS [a]
            // [v][a] concat ...
            
            // Упрощенный подход для стабильности: 
            // Просто вырежем куски и склеим их с переходом fade
            
            let vFilter = `[0:v]`;
            let aFilter = `[0:a]`;
            
            segments.forEach((seg, i) => {
                vFilter += `select='between(t,${seg.start},${seg.end})',setpts=PTS-STARTPTS`;
                aFilter += `aselect='between(t,${seg.start},${seg.end})',asetpts=PTS-STARTPTS`;
                
                if (i < segments.length - 1) {
                    vFilter += `,fade=out:0.5:st=${CONFIG.maxDuration/segments.length * (i+1) - 0.5}`; 
                    // Примечание: точное время fade сложно рассчитать в одной строке без переменных,
                    // поэтому применим простой fade при склейке через concat
                }
                
                if (i < segments.length - 1) {
                    vFilter += `,split[pre${i}][post${i}];`;
                    // Этот подход слишком сложен для динамической генерации в JS без ошибок.
                    // Используем более надежный метод: trim + concat
                }
            });

            // ПЕРЕПИСЫВАЕМ ПОДХОД ДЛЯ НАДЕЖНОСТИ:
            // Используем trim фильтр для каждого сегмента, затем concat.
            
            let trimFilters = "";
            let mapInputs = "";
            
            segments.forEach((seg, i) => {
                trimFilters += `[0:v]trim=start=${seg.start}:end=${seg.end},setpts=PTS-STARTPTS,${cropFilter},pad=max(iw\\,ih):max(iw\\,ih):(ow-iw)/2:(oh-ih)/2:black,scale=${outputFormat === 'vertical' ? '720:1280' : '1280:720'},fps=30[v${i}];`;
                trimFilters += `[0:a]atrim=start=${seg.start}:end=${seg.end},asetpts=PTS-STARTPTS[a${i}];`;
                mapInputs += `[v${i}][a${i}]`;
            });

            const finalFilter = `${trimFilters}${mapInputs}concat=n=${segments.length}:v=1:a=1,format=yuv420p[outv]`;
            
            log('Начало рендеринга (это может занять минуту)...');
            
            await ffmpeg.run(
                '-i', inputName,
                '-filter_complex', finalFilter,
                '-map', '[outv]',
                '-c:v', 'libx264',
                '-preset', 'ultrafast', // Быстрее для мобильных
                '-crf', '23',
                '-c:a', 'aac',
                '-b:a', '128k',
                'output.mp4'
            );

            const data = ffmpeg.FS('readFile', 'output.mp4');
            const videoBlob = new Blob([data.buffer], { type: 'video/mp4' });
            const videoUrl = URL.createObjectURL(videoBlob);

            // Показ результата
            const resArea = document.getElementById('resultArea');
            const outVid = document.getElementById('outputVideo');
            const dlLink = document.getElementById('downloadLink');
            
            outVid.src = videoUrl;
            dlLink.href = videoUrl;
            dlLink.download = 'smart-edit-result.mp4';
            
            resArea.style.display = 'block';
            log('Готово! Видео создано.', 'success');
            document.getElementById('statusText').innerText = "Завершено";
            document.getElementById('progressBar').style.width = '100%';

        } catch (err) {
            console.error(err);
            log(`Ошибка: ${err.message}`, 'warn');
            alert("Произошла ошибка при обработке. Попробуйте видео покороче или проще.");
        } finally {
            btn.disabled = false;
            btn.innerText = "🚀 Запустить AI Монтаж";
        }
    }
</script>

</body>
</html>
