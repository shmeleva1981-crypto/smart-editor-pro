<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SmartEditor Mobile | AI Clips</title>
    <!-- Шрифты -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- Библиотеки (Стабильные версии для мобильных) -->
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <style>
        :root {
            --bg: #09090b;
            --card: #18181b;
            --primary: #a855f7; /* Фиолетовый неон */
            --accent: #22c55e; /* Зеленый успех */
            --text: #ffffff;
            --text-sec: #a1a1aa;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 10px;
        }
        h1 { margin: 0; font-size: 24px; background: linear-gradient(to right, #d8b4fe, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p.subtitle { color: var(--text-sec); font-size: 14px; margin-top: 5px; }

        .card {
            background: var(--card);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #27272a;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        /* Настройки формата */
        .format-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .format-btn {
            flex: 1;
            padding: 10px;
            background: #27272a;
            border: none;
            border-radius: 8px;
            color: var(--text-sec);
            cursor: pointer;
            font-weight: 600;
        }
        .format-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.4);
        }

        /* Загрузка */
        .drop-zone {
            border: 2px dashed #3f3f46;
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .drop-zone.active { border-color: var(--primary); background: rgba(168, 85, 247, 0.1); }
        .icon-upload { font-size: 30px; margin-bottom: 10px; display: block; }

        /* Логи */
        .log-box {
            background: #000;
            border-radius: 8px;
            padding: 10px;
            height: 150px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            color: #ccc;
            border: 1px solid #333;
        }
        .log-item { margin-bottom: 4px; }
        .log-ok { color: var(--accent); }
        .log-warn { color: #eab308; }

        /* Кнопки */
        .btn-main {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(90deg, #a855f7, #ec4899);
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            opacity: 0.5;
            pointer-events: none;
            transition: 0.3s;
        }
        .btn-main.ready { opacity: 1; pointer-events: all; }
        .btn-main:active { transform: scale(0.98); }

        /* Результаты */
        .clips-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }
        .clip-item {
            background: #27272a;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }
        .clip-item video { width: 100%; height: auto; display: block; }
        .clip-info {
            padding: 8px;
            font-size: 11px;
            text-align: center;
            background: rgba(0,0,0,0.8);
            position: absolute;
            bottom: 0;
            width: 100%;
        }
        
        .download-all-btn {
            margin-top: 20px;
            background: var(--accent);
            color: #000;
            display: none; /* Скрыта пока нет клипов */
        }

        /* Скрытые элементы */
        #videoSource, #canvasProcess { display: none; }
        
        .loader {
            border: 3px solid #333;
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 10px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>SmartEditor Mobile</h1>
        <p class="subtitle">AI Нарезка длинных видео на клипы</p>
    </header>

    <!-- Настройки -->
    <div class="card">
        <label style="font-size: 12px; color: var(--text-sec); display:block; margin-bottom:8px;">Формат выхода:</label>
        <div class="format-selector">
            <button class="format-btn active" onclick="setFormat('vertical')" id="btnVert">📱 Вертикальный (9:16)</button>
            <button class="format-btn" onclick="setFormat('horizontal')" id="btnHoriz">🖥 Горизонтальный (16:9)</button>
        </div>
        
        <div class="drop-zone" id="dropZone">
            <span class="icon-upload">📁</span>
            <div>Нажми, чтобы выбрать видео</div>
            <div style="font-size: 11px; color: #666; margin-top: 5px;">Поддерживаются длинные видео (MP4, MOV)</div>
        </div>
        <input type="file" id="fileInput" accept="video/*" style="display:none">
    </div>

    <!-- Статус -->
    <div class="card" id="statusCard" style="display:none;">
        <div class="log-box" id="logBox"></div>
        <button class="btn-main" id="processBtn" style="margin-top: 15px;">
            ✂️ Начать умную нарезку
        </button>
    </div>

    <!-- Результат -->
    <div class="card" id="resultCard" style="display:none;">
        <h3 style="margin:0 0 10px 0;">Готовые клипы:</h3>
        <div class="clips-list" id="clipsList"></div>
        <button class="btn-main download-all-btn" id="downloadZipBtn" style="display:block;">
            📦 Скачать всё (ZIP архив)
        </button>
    </div>
</div>

<!-- Скрытые элементы для обработки -->
<video id="videoSource" playsinline crossorigin="anonymous"></video>
<canvas id="canvasProcess"></canvas>

<script>
    const { createFFmpeg, fetchFile } = FFmpeg;
    // Инициализация FFmpeg с настройками для совместимости
    const ffmpeg = createFFmpeg({ 
        log: true,
        corePath: 'https://unpkg.com/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js'
    });

    let selectedFile = null;
    let outputFormat = 'vertical'; // vertical или horizontal
    let generatedClips = []; // Хранилище для_blob файлов

    // Элементы UI
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const statusCard = document.getElementById('statusCard');
    const processBtn = document.getElementById('processBtn');
    const logBox = document.getElementById('logBox');
    const resultCard = document.getElementById('resultCard');
    const clipsList = document.getElementById('clipsList');
    const downloadZipBtn = document.getElementById('downloadZipBtn');
    const videoEl = document.getElementById('videoSource');
    const canvas = document.getElementById('canvasProcess');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    // --- Логирование ---
    function log(msg, type = 'info') {
        const div = document.createElement('div');
        div.className = 'log-item';
        if (type === 'ok') div.classList.add('log-ok');
        if (type === 'warn') div.classList.add('log-warn');
        div.innerText = `> ${msg}`;
        logBox.appendChild(div);
        logBox.scrollTop = logBox.scrollHeight;
    }

    // --- Выбор формата ---
    window.setFormat = (fmt) => {
        outputFormat = fmt;
        document.getElementById('btnVert').classList.toggle('active', fmt === 'vertical');
        document.getElementById('btnHoriz').classList.toggle('active', fmt === 'horizontal');
        log(`Формат изменен на: ${fmt === 'vertical' ? 'Вертикальный (TikTok)' : 'Горизонтальный (YouTube)'}`);
    };

    // --- Загрузка файла ---
    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));
    
    // Drag & Drop
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('active'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('active'));
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('active');
        if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });

    function handleFile(file) {
        if (!file || !file.type.startsWith('video/')) {
            alert('Пожалуйста, выберите видеофайл.');
            return;
        }
        selectedFile = file;
        statusCard.style.display = 'block';
        resultCard.style.display = 'none';
        clipsList.innerHTML = '';
        generatedClips = [];
        downloadZipBtn.style.display = 'none';
        
        log(`Файл загружен: ${file.name} (${(file.size/1024/1024).toFixed(2)} MB)`);
        log('Готов к обработке.', 'ok');
        processBtn.classList.add('ready');
        processBtn.innerText = '✂️ Начать умную нарезку';
    }

    // --- Основной процесс ---
    processBtn.addEventListener('click', async () => {
        if (!selectedFile) return;
        
        processBtn.classList.remove('ready');
        processBtn.innerHTML = '<span class="loader"></span> Обработка...';
        resultCard.style.display = 'none';

        try {
            // 1. Инициализация FFmpeg
            if (!ffmpeg.isLoaded()) {
                log('Загрузка движка монтажа...', 'warn');
                await ffmpeg.load();
                log('Движок готов.', 'ok');
            }

            // 2. Загрузка видео в память FFmpeg
            log('Чтение видео файла...');
            ffmpeg.FS('writeFile', 'input.mp4', await fetchFile(selectedFile));

            // 3. Анализ видео (Поиск сцен с лицами)
            // Для скорости анализируем каждый 30-й кадр (примерно 1 раз в секунду)
            log('Запуск AI анализа лиц...', 'warn');
            await analyzeVideoForFaces();

            // 4. Нарезка на клипы
            log('Нарезка лучших моментов...');
            await cutClips();

            // 5. Финал
            log('Все клипы готовы!', 'ok');
            showResults();

        } catch (error) {
            console.error(error);
            log(`Ошибка: ${error.message}`, 'warn');
            alert('Произошла ошибка при обработке. Попробуйте видео меньшего размера.');
        } finally {
            processBtn.classList.add('ready');
            processBtn.innerText = '✂️ Повторить обработку';
        }
    });

    // --- AI Анализ (FaceAPI) ---
    let goodSegments = []; // {start, end, score}

    async function analyzeVideoForFaces() {
        // Загрузка моделей face-api
        await faceapi.nets.tinyFaceDetector.loadFromUri('https://justadudewhohacks.github.io/face-api.js/models');
        await faceapi.nets.faceExpressionNet.loadFromUri('https://justadudewhohacks.github.io/face-api.js/models');

        videoEl.src = URL.createObjectURL(selectedFile);
        videoEl.muted = true;
        await new Promise(r => videoEl.onloadeddata = r);

        const duration = videoEl.duration;
        const step = 2.0; // Шаг анализа 2 секунды (для скорости на телефоне)
        const totalSteps = Math.floor(duration / step);
        
        goodSegments = [];
        let currentSegmentStart = null;
        let consecutiveFrames = 0;

        log(`Анализ ${totalSteps} точек видео...`);

        for (let i = 0; i < totalSteps; i++) {
            const time = i * step;
            videoEl.currentTime = time;
            await new Promise(r => videoEl.onseeked = r);

            // Рисуем кадр на канвас
            canvas.width = videoEl.videoWidth;
            canvas.height = videoEl.videoHeight;
            ctx.drawImage(videoEl, 0, 0);

            // Детекция
            const detections = await faceapi.detectAllFaces(canvas, new faceapi.TinyFaceDetectorOptions()).withFaceExpressions();

            if (detections.length > 0) {
                // Нашли лицо! Проверяем эмоции (если есть улыбка или нейтрально - хорошо)
                // Для простоты считаем наличие лица хорошим признаком
                if (!currentSegmentStart) {
                    currentSegmentStart = time;
                }
                consecutiveFrames++;
            } else {
                // Лица нет
                if (currentSegmentStart !== null && consecutiveFrames >= 2) {
                    // Сохраняем сегмент, если лицо было видно хотя бы 2 шага (4 сек)
                    goodSegments.push({
                        start: currentSegmentStart,
                        end: time,
                        duration: time - currentSegmentStart
                    });
                }
                currentSegmentStart = null;
                consecutiveFrames = 0;
            }
            
            // Прогресс
            if (i % 5 === 0) log(`Анализ: ${Math.round((i/totalSteps)*100)}%`);
        }
        
        // Проверка последнего сегмента
        if (currentSegmentStart !== null && consecutiveFrames >= 2) {
            goodSegments.push({ start: currentSegmentStart, end: duration, duration: duration - currentSegmentStart });
        }

        log(`Найдено ${goodSegments.length} потенциальных сцен с лицом.`, 'ok');
        
        // Ограничиваем количество клипов, чтобы телефон не завис (макс 5 клипов по 60 сек)
        if (goodSegments.length > 5) {
            goodSegments = goodSegments.slice(0, 5);
            log('Выбраны топ-5 лучших сцен для нарезки.', 'warn');
        }
    }

    // --- Нарезка через FFmpeg ---
    async function cutClips() {
        generatedClips = [];
        const maxClipDuration = 59; // Макс длина клипа 59 сек (для TikTok/Shorts)

        for (let i = 0; i < goodSegments.length; i++) {
            const seg = goodSegments[i];
            log(`Обработка клипа ${i+1}/${goodSegments.length}...`);

            let clipDuration = seg.duration;
            let startTime = seg.start;

            // Если сегмент слишком длинный, режем его на части по 60 сек
            while (clipDuration > 0) {
                const currentLen = Math.min(clipDuration, maxClipDuration);
                const outputName = `clip_${i+1}_${Math.floor(startTime)}.mp4`;

                // Команда FFmpeg
                // 1. Trim (вырезать время)
                // 2. Scale/Crop (под формат)
                let filterComplex = '';
                
                if (outputFormat === 'vertical') {
                    // Кроп центра для вертикали
                    filterComplex = 'crop=min(iw\,ih):min(iw\,ih),scale=720:1280,pad=720:1280:(ow-iw)/2:(oh-ih)/2:black';
                } else {
                    // Просто скейл для горизонтали
                    filterComplex = 'scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2:black';
                }

                // Добавляем аудио и видео фильтры
                // -ss начало, -t длительность
                await ffmpeg.run(
                    '-i', 'input.mp4',
                    '-ss', startTime.toString(),
                    '-t', currentLen.toString(),
                    '-vf', filterComplex,
                    '-c:v', 'libx264',
                    '-preset', 'ultrafast', // Быстрее для мобильных
                    '-c:a', 'aac',
                    outputName
                );

                // Читаем результат
                const data = ffmpeg.FS('readFile', outputName);
                const blob = new Blob([data.buffer], { type: 'video/mp4' });
                
                generatedClips.push({
                    name: outputName,
                    blob: blob,
                    url: URL.createObjectURL(blob)
                });

                // Очищаем память FFmpeg
                ffmpeg.FS('unlink', outputName);

                clipDuration -= currentLen;
                startTime += currentLen;
                
                if (clipDuration > 0) log(`Клип ${i+1} длинный, создаю часть...`);
            }
        }
    }

    function showResults() {
        resultCard.style.display = 'block';
        clipsList.innerHTML = '';
        
        generatedClips.forEach((clip, idx) => {
            const div = document.createElement('div');
            div.className = 'clip-item';
            div.innerHTML = `
                <video src="${clip.url}" controls></video>
                <div class="clip-info">Клип #${idx+1}</div>
            `;
            clipsList.appendChild(div);
        });

        downloadZipBtn.style.display = 'block';
        window.scrollTo(0, document.body.scrollHeight);
    }

    // --- Скачивание ZIP ---
    downloadZipBtn.addEventListener('click', () => {
        const zip = new JSZip();
        const folder = zip.folder("smart_editor_clips");
        
        generatedClips.forEach(clip => {
            folder.file(clip.name, clip.blob);
        });

        log('Упаковка архива...');
        zip.generateAsync({type:"blob"}).then(function(content) {
            saveAs(content, "my_smart_clips.zip");
            log('Архив скачан!', 'ok');
        });
    });

</script>
</body>
</html>
