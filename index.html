<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartEditor Pro | Local AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f0f1a;
            --card-bg: #1a1a2e;
            --primary-gradient: linear-gradient(90deg, #d946ef, #ec4899);
            --accent-green: #84cc16;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 1px solid #333;
        }

        .brand {
            font-size: 20px;
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-box {
            background: #151525;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #333;
            font-size: 12px;
            color: var(--text-muted);
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 30px 20px;
            text-align: center;
            border: 1px solid #333;
        }

        .upload-area {
            border: 2px dashed #444;
            border-radius: 12px;
            padding: 40px 20px;
            margin-bottom: 20px;
            cursor: pointer;
            transition: 0.3s;
        }
        .upload-area:hover { border-color: #d946ef; background: rgba(217, 70, 239, 0.05); }

        h3 { margin: 10px 0 5px; }
        .sub-text { color: var(--text-muted); font-size: 13px; margin-bottom: 15px; display: block; }

        .btn-action {
            background: var(--primary-gradient);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(217, 70, 239, 0.3);
        }
        .btn-action:disabled { background: #444; cursor: not-allowed; box-shadow: none; }

        #fileInput { display: none; }
        #hiddenVideo { display: none; }

        .log-area {
            background: #111;
            padding: 15px;
            border-radius: 10px;
            font-family: monospace;
            font-size: 12px;
            color: #aaa;
            height: 180px;
            overflow-y: auto;
            border: 1px solid #333;
        }
        .log-success { color: var(--accent-green); }
        .log-error { color: #ef4444; }
        .log-ai { color: #d946ef; font-weight: bold; }
        .log-process { color: #3b82f6; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div class="brand">SmartEditor <span style="font-size: 10px; opacity: 0.7;">LOCAL AI</span></div>
    </div>

    <div class="status-box">
        🔒 <b>Локальный режим:</b> Нейросеть работает внутри браузера. Ключи не нужны. Данные никуда не отправляются.
    </div>

    <div class="card">
        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
            <div style="font-size: 30px;">📂</div>
            <h3>Загрузить видео</h3>
            <span class="sub-text">Будем искать лица и эмоции</span>
        </div>
        
        <input type="file" id="fileInput" accept="video/*">
        <br>
        <button id="processBtn" class="btn-action" disabled onclick="analyzeLocal()">
            🧠 Анализировать
        </button>
    </div>

    <div class="log-area" id="logs">
        > Система готова.
    </div>
</div>

<!-- Скрытые элементы -->
<video id="hiddenVideo" muted playsinline crossorigin="anonymous"></video>

<!-- Используем стабильную версию библиотеки -->
<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

<script>
    const fileInput = document.getElementById('fileInput');
    const processBtn = document.getElementById('processBtn');
    const logs = document.getElementById('logs');
    const videoPlayer = document.getElementById('hiddenVideo');

    // 🔥 НОВЫЙ НАДЕЖНЫЙ CDN ДЛЯ МОДЕЛЕЙ
    const MODEL_URL = 'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@0.22.2/weights/';

    addLog("🔄 Скачиваем нейросети (CDN jsDelivr)...", "log-process");

    // Загружаем модели
    Promise.all([
        faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
        faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL),
        faceapi.nets.ageGenderNet.loadFromUri(MODEL_URL),
    ]).then(() => {
        addLog("✅ УСПЕХ! Нейросети загружены и готовы к работе.", "log-success");
        fileInput.disabled = false; 
    }).catch(err => {
        addLog("❌ Ошибка загрузки: " + err, "log-error");
        addLog("💡 Если ошибка повторится, отключите AdBlock/расширения конфиденциальности и обновите страницу (Ctrl+F5)", "log-error");
    });

    // Отображение списка файлов
    fileInput.addEventListener('change', function() {
        if (this.files.length > 0) {
            processBtn.disabled = false;
            addLog(`📂 Файл выбран: ${this.files[0].name}`);
        }
    });

    function addLog(text, type = '') {
        const p = document.createElement('div');
        p.innerText = '> ' + text;
        if (type) p.className = type;
        logs.appendChild(p);
        logs.scrollTop = logs.scrollHeight;
    }

    // === АНАЛИЗ В БРАУЗЕРЕ ===
    async function analyzeLocal() {
        processBtn.disabled = true;
        processBtn.innerText = "🧠 Думаю...";
        
        const file = fileInput.files[0];
        const url = URL.createObjectURL(file);
        videoPlayer.src = url;

        // Ждем загрузки метаданных
        await new Promise(r => videoPlayer.onloadedmetadata = r);
        
        const duration = videoPlayer.duration;
        // Проверяем 3 момента: 1 сек, середина, конец
        const timePoints = [1, duration/2, duration-2].filter(t => t > 1 && t < duration);
        
        addLog(`🎬 Сканируем ${timePoints.length} ключевых моментов...`, "log-process");

        for (let time of timePoints) {
            videoPlayer.currentTime = time;
            // Ждем перемотки
            await new Promise(r => videoPlayer.onseeked = r);

            // Анализируем кадр
            const detection = await faceapi.detectAllFaces(videoPlayer, new faceapi.TinyFaceDetectorOptions())
                .withFaceExpressions();

            if (detection.length > 0) {
                addLog(`📸 Кадр ${time.toFixed(1)}с: Лицо найдено!`, "log-success");
                
                detection.forEach(det => {
                    // Находим самую сильную эмоцию
                    const emotions = det.expressions;
                    const strongestEmotion = Object.keys(emotions).sort((a, b) => emotions[b] - emotions[a])[0];
                    const percentage = Math.round(emotions[strongestEmotion] * 100);

                    addLog(`   🎭 Эмоция: ${translateEmotion(strongestEmotion)} (${percentage}%)`, "log-ai");

                    if (strongestEmotion === 'happy' && percentage > 70) {
                        addLog(`   🔥 РАЗЫСКО! (Смех/Радость)`, "log-success");
                    }
                });
            } else {
                addLog(`⚪ Кадр ${time.toFixed(1)}с: Лиц не обнаружено.`, "log-process");
            }
            await new Promise(r => setTimeout(r, 500)); // Пауза для стабильности
        }

        addLog("✅ Сканирование завершено!", "log-success");
        processBtn.innerText = "Готово!";
        processBtn.disabled = false;
        
        URL.revokeObjectURL(url);
    }

    function translateEmotion(en) {
        const dict = {
            'neutral': 'Нейтрально',
            'happiness': 'Радость/Смех',
            'sadness': 'Грусть',
            'anger': 'Злость',
            'fear': 'Страх',
            'disgust': 'Отвращение',
            'surprise': 'Удивление'
        };
        return dict[en] || en;
    }
</script>

</body>
</html>
