<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartEditor Pro | AI Montage</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Библиотеки -->
    <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.7/dist/umd/ffmpeg.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <style>
        :root {
            --bg-color: #0f0f1a;
            --card-bg: #1a1a2e;
            --primary-gradient: linear-gradient(90deg, #d946ef, #ec4899);
            --accent-green: #84cc16;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            text-align: center;
            padding-bottom: 15px;
            border-bottom: 1px solid #333;
        }

        .brand {
            font-size: 24px;
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #333;
        }

        .upload-area {
            border: 2px dashed #444;
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 15px;
        }
        .upload-area:hover { border-color: #d946ef; background: rgba(217, 70, 239, 0.05); }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        select {
            background: #252540;
            color: white;
            border: 1px solid #444;
            padding: 12px;
            border-radius: 8px;
            width: 100%;
            font-family: inherit;
        }

        .btn-action {
            background: var(--primary-gradient);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(217, 70, 239, 0.3);
            transition: 0.2s;
        }
        .btn-action:disabled { background: #444; cursor: not-allowed; box-shadow: none; opacity: 0.7; }

        #fileInput { display: none; }
        
        /* Скрытое видео для анализа */
        #hiddenVideo { display: none; }
        #previewCanvas { width: 100%; border-radius: 8px; display: none; margin-top: 10px; }

        .log-area {
            background: #111;
            padding: 15px;
            border-radius: 10px;
            font-family: monospace;
            font-size: 12px;
            color: #aaa;
            height: 200px;
            overflow-y: auto;
            border: 1px solid #333;
        }
        .log-success { color: var(--accent-green); }
        .log-error { color: #ef4444; }
        .log-ai { color: #d946ef; font-weight: bold; }
        .log-process { color: #3b82f6; }

        .result-box {
            display: none;
            background: #252540;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid var(--accent-green);
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .download-btn {
            background: var(--accent-green);
            color: #000;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            display: inline-block;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div class="brand">SmartEditor Pro</div>
        <div style="font-size: 12px; color: #666;">AI Powered Client-Side Editor</div>
    </div>

    <div class="card">
        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
            <div style="font-size: 30px;">📁</div>
            <h3>Загрузить видео</h3>
            <span class="sub-text">MP4, MOV (до 200МБ для стабильности)</span>
        </div>
        <input type="file" id="fileInput" accept="video/*">
        
        <canvas id="previewCanvas"></canvas>

        <div class="controls">
            <div>
                <label style="font-size: 12px; color: #aaa; display:block; margin-bottom:5px;">Формат выхода</label>
                <select id="outputFormat">
                    <option value="vertical">📱 Вертикальный (9:16)</option>
                    <option value="horizontal">💻 Горизонтальный (16:9)</option>
                </select>
            </div>
            <div>
                <label style="font-size: 12px; color: #aaa; display:block; margin-bottom:5px;">Длина ролика</label>
                <select id="targetDuration">
                    <option value="15">15 сек (Shorts)</option>
                    <option value="30">30 сек (Reels)</option>
                    <option value="60">60 сек (TikTok)</option>
                </select>
            </div>
        </div>

        <button class="btn-action" id="startBtn" disabled>🚀 Запустить AI Монтаж</button>
    </div>

    <div class="log-area" id="logArea">
        <div class="log-process">Ожидание загрузки файла...</div>
    </div>

    <div class="result-box" id="resultBox">
        <h3 style="color: var(--accent-green); margin-top:0;">✅ Монтаж завершен!</h3>
        <p id="resultText">Видео готово к скачиванию.</p>
        <a href="#" class="download-btn" id="downloadLink">📥 Скачать MP4</a>
    </div>
</div>

<video id="hiddenVideo" crossOrigin="anonymous" playsinline></video>

<script>
    const { FFmpeg } = ffmpegWasm;
    let ffmpeg = null;
    let isLoaded = false;

    const fileInput = document.getElementById('fileInput');
    const hiddenVideo = document.getElementById('hiddenVideo');
    const previewCanvas = document.getElementById('previewCanvas');
    const startBtn = document.getElementById('startBtn');
    const logArea = document.getElementById('logArea');
    const resultBox = document.getElementById('resultBox');
    const downloadLink = document.getElementById('downloadLink');
    
    // Настройки
    const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model'; // Используем CDN модель

    function log(msg, type = 'normal') {
        const div = document.createElement('div');
        div.textContent = `> ${msg}`;
        if (type === 'success') div.className = 'log-success';
        if (type === 'error') div.className = 'log-error';
        if (type === 'ai') div.className = 'log-ai';
        if (type === 'process') div.className = 'log-process';
        logArea.appendChild(div);
        logArea.scrollTop = logArea.scrollHeight;
    }

    // Инициализация FaceAPI
    async function loadModels() {
        log('Загрузка нейросетей (лицо/эмоции)...', 'process');
        try {
            await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
            await faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL);
            log('Нейросети готовы!', 'success');
            return true;
        } catch (e) {
            log('Ошибка загрузки моделей: ' + e.message, 'error');
            return false;
        }
    }

    // Инициализация FFmpeg
    async function initFFmpeg() {
        if (isLoaded) return true;
        log('Инициализация видео-движка...', 'process');
        try {
            ffmpeg = new FFmpeg();
            ffmpeg.on('log', ({ message }) => {
                // console.log(message); // Можно включить для отладки
            });
            ffmpeg.on('progress', ({ progress }) => {
                // Обновление прогресса можно вывести в лог если нужно
            });
            
            // ВАЖНО: Загрузка с настройками для SharedArrayBuffer
            await ffmpeg.load({
                coreURL: "https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.js",
            });
            
            isLoaded = true;
            log('Видео-движок готов!', 'success');
            return true;
        } catch (e) {
            log('Критическая ошибка FFmpeg: ' + e.message, 'error');
            log('Убедитесь, что сайт открыт через HTTPS и заголовки COOP/COEP настроены.', 'error');
            return false;
        }
    }

    fileInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        resultBox.style.display = 'none';
        log(`Файл выбран: ${file.name}`, 'process');
        
        // Показываем превью
        const url = URL.createObjectURL(file);
        hiddenVideo.src = url;
        hiddenVideo.onloadeddata = () => {
            previewCanvas.style.display = 'block';
            const ctx = previewCanvas.getContext('2d');
            previewCanvas.width = hiddenVideo.videoWidth;
            previewCanvas.height = hiddenVideo.videoHeight;
            ctx.drawImage(hiddenVideo, 0, 0);
            startBtn.disabled = false;
            log('Видео загружено. Готово к анализу.', 'success');
        };

        // Предварительная загрузка моделей
        await loadModels();
    });

    startBtn.addEventListener('click', async () => {
        if (!hiddenVideo.src) return;
        startBtn.disabled = true;
        resultBox.style.display = 'none';
        logArea.innerHTML = '';

        const format = document.getElementById('outputFormat').value;
        const duration = parseInt(document.getElementById('targetDuration').value);

        // 1. Запуск FFmpeg
        const ffmpegReady = await initFFmpeg();
        if (!ffmpegReady) {
            startBtn.disabled = false;
            return;
        }

        try {
            // 2. Анализ видео (поиск лиц и эмоций)
            log('Анализ видеопотока нейросетью...', 'ai');
            const segments = await analyzeVideoContent(hiddenVideo, duration);
            
            if (segments.length === 0) {
                log('Лица не найдены. Будет использована случайная нарезка.', 'error');
                // Фолбэк: просто режем по времени
                segments.push({ start: 0, end: Math.min(duration, hiddenVideo.duration) });
            } else {
                log(`Найдено ${segments.length} перспективных сегментов.`, 'success');
            }

            // 3. Подготовка команд для FFmpeg
            log('Начало рендеринга...', 'process');
            
            // Записываем файл в виртуальную ФС
            const data = await fetchFile(hiddenVideo.src);
            ffmpeg.writeFile('input.mp4', data);

            // Формируем фильтр для кропа и эффектов
            let filterComplex = '';
            if (format === 'vertical') {
                // Crop center square then scale to 9:16
                filterComplex = '[0:v]crop=min(iw\\,ih):min(iw\\,ih),scale=720:1280:force_original_aspect_ratio=decrease,pad=720:1280:(ow-iw)/2:(oh-ih)/2,eq=saturation=1.2:contrast=1.1[outv]';
            } else {
                // Scale to 16:9
                filterComplex = '[0:v]scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,eq=saturation=1.2:contrast=1.1[outv]';
            }

            // Если есть сегменты, делаем конкатенацию
            if (segments.length > 1) {
                let concatList = '';
                segments.forEach((seg, index) => {
                    const fname = `seg${index}.mp4`;
                    // Вырезаем кусок
                    await ffmpeg.run(
                        '-ss', seg.start.toString(),
                        '-t', (seg.end - seg.start).toString(),
                        '-i', 'input.mp4',
                        '-vf', filterComplex.replace('[0:v]', '[0]').split('[outv]')[0] + `,setpts=PTS-STARTPTS[out${index}]`,
                        '-map', `[out${index}]`,
                        '-c:v', 'libx264',
                        '-preset', 'ultrafast',
                        fname
                    );
                    concatList += `file '${fname}'\n`;
                });

                ffmpeg.writeFile('list.txt', concatList);
                
                log('Склейка фрагментов с переходами...', 'process');
                // Склеиваем
                await ffmpeg.run('-f', 'concat', '-safe', '0', '-i', 'list.txt', '-c', 'copy', 'output.mp4');
            } else {
                // Один сегмент
                const seg = segments[0];
                await ffmpeg.run(
                    '-ss', seg.start.toString(),
                    '-t', (seg.end - seg.start).toString(),
                    '-i', 'input.mp4',
                    '-vf', filterComplex,
                    '-map', '[outv]',
                    '-c:v', 'libx264',
                    '-preset', 'medium',
                    '-crf', '23',
                    'output.mp4'
                );
            }

            // 4. Получение результата
            log('Финализация файла...', 'process');
            const outputData = await ffmpeg.readFile('output.mp4');
            const blob = new Blob([outputData.buffer], { type: 'video/mp4' });
            const url = URL.createObjectURL(blob);

            downloadLink.href = url;
            downloadLink.download = `smart_edit_${format}_${Date.now()}.mp4`;
            
            resultBox.style.display = 'block';
            log('Готово! Видео можно скачать.', 'success');

        } catch (err) {
            console.error(err);
            log('Ошибка обработки: ' + err.message, 'error');
            if (err.message.includes('SharedArrayBuffer')) {
                log('ВНИМАНИЕ: Требуется файл _headers для работы на GitHub Pages!', 'error');
            }
        } finally {
            startBtn.disabled = false;
        }
    });

    // Функция анализа видео (AI Vision)
    async function analyzeVideoContent(video, targetDuration) {
        const segments = [];
        const videoDuration = video.duration;
        const step = 2.0; // Проверяем каждые 2 секунды для скорости
        
        // Создаем временный канвас для анализа
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 128; // Низкое разрешение для скорости анализа
        canvas.height = 72;

        let currentTime = 0;
        let bestStart = 0;
        let bestScore = 0;
        let currentSegmentStart = -1;

        while (currentTime < videoDuration) {
            video.currentTime = currentTime;
            // Ждем обновления кадра
            await new Promise(r => setTimeout(r, 100)); 
            
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const detections = await faceapi.detectAllFaces(canvas, new faceapi.TinyFaceDetectorOptions()).withFaceExpressions();
            
            let hasFace = detections.length > 0;
            let emotionScore = 0;
            
            if (hasFace) {
                // Считаем сумму позитивных эмоций
                detections.forEach(d => {
                    emotionScore += d.expressions.happy || 0;
                    emotionScore += d.expressions.surprised || 0;
                    emotionScore += d.expressions.neutral || 0.5; // Нейтральное тоже ок для речи
                });
                emotionScore /= detections.length;
            }

            // Логика "Умной нарезки"
            // Если есть лицо и эмоция > порога, считаем это хорошим моментом
            if (hasFace && emotionScore > 0.3) {
                if (currentSegmentStart === -1) {
                    currentSegmentStart = currentTime;
                }
            } else {
                if (currentSegmentStart !== -1) {
                    // Конец хорошего момента
                    const segLen = currentTime - currentSegmentStart;
                    if (segLen > 3) { // Минимум 3 секунды
                        segments.push({
                            start: currentSegmentStart,
                            end: currentTime,
                            score: emotionScore
                        });
                    }
                    currentSegmentStart = -1;
                }
            }

            currentTime += step;
            if (segments.length > 5) break; // Не ищем слишком много, хватит лучших
        }

        // Если нашли сегменты, выбираем лучшие, чтобы влезли в targetDuration
        if (segments.length > 0) {
            // Сортируем поscore (эмоциональности)
            segments.sort((a, b) => b.score - a.score);
            
            // Берем первый подходящий по длине или комбинируем
            // Для простоты вернем самый лучший кусок, обрезанный под длительность
            let best = segments[0];
            if ((best.end - best.start) > targetDuration) {
                best.end = best.start + targetDuration;
            }
            return [best];
        }

        // Если ничего не нашли, возвращаем начало видео
        return [{ start: 0, end: Math.min(targetDuration, videoDuration) }];
    }
</script>

</body>
</html>
